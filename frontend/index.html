<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore public GitHub developer profiles, activity metrics, and repository analytics with interactive charts and README previews." />
  <title>GitHub Profile Explorer</title>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="app-container">
    <!-- Navigation Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">GitHub Explorer</h1>
          <p class="brand-subtitle">Inspect public profiles, stats &amp; repositories</p>
        </div>
      </div>

      <div class="header-actions">
        <form class="search-form" id="search-form">
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
            <input type="text" id="search-input" class="search-input" placeholder="Search GitHub username..." autocomplete="off" spellcheck="false" />
          </div>
          <button type="submit" id="search-btn" class="btn-primary">
            Search
          </button>
        </form>

        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle color theme" title="Toggle theme">
          <!-- Dynamically filled with icon -->
        </button>
      </div>
    </header>

    <!-- Quick Suggestions & Recent Searches -->
    <div id="chips-container" class="chips-bar">
      <!-- Rendered dynamically -->
    </div>

    <!-- Error Alert Banner -->
    <div id="alert-banner" class="alert-banner error" style="display: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="alert-message">User not found</span>
    </div>

    <!-- Skeleton Loading State -->
    <div id="loading-skeleton" style="display: none;">
      <div class="card" style="padding: 2rem; margin-bottom: 2rem; display: flex; gap: 1.5rem;">
        <div class="skeleton" style="width: 120px; height: 120px; border-radius: var(--radius-xl); flex-shrink: 0;"></div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 0.75rem;">
          <div class="skeleton" style="height: 32px; width: 40%;"></div>
          <div class="skeleton" style="height: 18px; width: 25%;"></div>
          <div class="skeleton" style="height: 16px; width: 70%;"></div>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
            <div class="skeleton" style="height: 28px; width: 110px; border-radius: 999px;"></div>
            <div class="skeleton" style="height: 28px; width: 110px; border-radius: 999px;"></div>
          </div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="card skeleton" style="height: 90px;"></div>
        <div class="card skeleton" style="height: 90px;"></div>
        <div class="card skeleton" style="height: 90px;"></div>
        <div class="card skeleton" style="height: 90px;"></div>
      </div>
    </div>

    <!-- Main Content Area -->
    <main id="content-area">
      <!-- Profile Header Card -->
      <section class="card profile-card" id="profile-card">
        <div class="profile-avatar-wrapper">
          <img id="profile-avatar" class="profile-avatar" src="" alt="Avatar" />
        </div>
        <div class="profile-info">
          <div class="profile-header-meta">
            <h2 id="profile-name" class="profile-name"></h2>
            <a id="profile-handle" class="profile-handle" href="" target="_blank" rel="noreferrer"></a>
          </div>
          <p id="profile-bio" class="profile-bio"></p>
          <div id="profile-meta" class="profile-details-grid"></div>
          <div id="profile-badges" class="profile-badges-row"></div>
        </div>
      </section>

      <!-- Metric Stats 4-Card Grid -->
      <section class="stats-grid" aria-label="Key Repository Metrics">
        <div class="card stat-card">
          <div class="stat-icon stars">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
          </div>
          <div>
            <div class="stat-label">Total Stars</div>
            <div class="stat-value" id="stat-stars">0</div>
          </div>
        </div>

        <div class="card stat-card">
          <div class="stat-icon forks">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="18" r="3"/>
              <circle cx="6" cy="6" r="3"/>
              <circle cx="18" cy="6" r="3"/>
              <path d="M18 9v1a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9"/>
              <path d="M12 12v3"/>
            </svg>
          </div>
          <div>
            <div class="stat-label">Total Forks</div>
            <div class="stat-value" id="stat-forks">0</div>
          </div>
        </div>

        <div class="card stat-card">
          <div class="stat-icon watchers">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
          <div>
            <div class="stat-label">Watchers</div>
            <div class="stat-value" id="stat-watchers">0</div>
          </div>
        </div>

        <div class="card stat-card">
          <div class="stat-icon issues">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <div>
            <div class="stat-label">Open Issues</div>
            <div class="stat-value" id="stat-issues">0</div>
          </div>
        </div>
      </section>

      <!-- Charts Row (Stars Bar Chart & Language Donut) -->
      <section class="charts-grid">
        <div class="card chart-card">
          <div class="chart-header">
            <h3 class="chart-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"/>
                <line x1="12" y1="20" x2="12" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="14"/>
              </svg>
              Top Repositories by Stars
            </h3>
          </div>
          <div class="chart-container" id="bar-chart-container"></div>
        </div>

        <div class="card chart-card">
          <div class="chart-header">
            <h3 class="chart-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>
                <path d="M22 12A10 10 0 0 0 12 2v10z"/>
              </svg>
              Language Distribution
            </h3>
          </div>
          <div class="chart-container" id="donut-chart-container"></div>
        </div>
      </section>

      <!-- Contribution Activity Heatmap -->
      <section class="card heatmap-card">
        <div class="chart-header">
          <h3 class="chart-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            Public Activity Matrix (Last 365 Days)
          </h3>
        </div>
        <div class="heatmap-scroll" id="heatmap-container"></div>
      </section>

      <!-- Repository Catalog Browser -->
      <section class="repo-browser-section">
        <div class="repo-toolbar">
          <div style="display: flex; align-items: baseline; gap: 0.75rem;">
            <h2>Repositories</h2>
            <span class="badge" id="repo-count-badge">0</span>
          </div>

          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <input type="text" id="repo-search" class="repo-search-input" placeholder="Filter repositories..." />
            <div class="repo-filters">
              <select id="repo-lang-filter" class="select-custom" aria-label="Filter by language">
                <option value="all">All Languages</option>
              </select>
              <select id="repo-sort" class="select-custom" aria-label="Sort repositories">
                <option value="stars">Most Stars</option>
                <option value="updated">Recently Pushed</option>
                <option value="name">Name</option>
              </select>
            </div>
          </div>
        </div>

        <div class="repo-grid" id="repo-grid"></div>
      </section>

      <!-- Recent Public Activity Feed -->
      <section class="card activity-card">
        <div class="chart-header">
          <h3 class="chart-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            Recent Public Timeline
          </h3>
        </div>
        <ul class="activity-list" id="activity-list"></ul>
      </section>
    </main>

    <!-- Slide-out In-App README Viewer Drawer -->
    <div id="drawer-backdrop" class="drawer-backdrop">
      <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <div class="drawer-header">
          <h3 id="drawer-title" class="drawer-title">README</h3>
          <button id="drawer-close-btn" class="drawer-close-btn" aria-label="Close README viewer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div id="drawer-body" class="drawer-body"></div>
      </aside>
    </div>
  </div>

  <!-- Main Application ES Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
